name: Feature request
description: Suggest an idea or a game to support
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the lag, loss or annoyance you run into.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: input
    id: game
    attributes:
      label: Game and region (if relevant)
      placeholder: e.g. Apex Legends, Bahrain servers
